[package]
name = "upols_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "upols_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
numpy = "0.25"
ndarray = "0.16"
num-complex = "0.4"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
