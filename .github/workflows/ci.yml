name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

  rust:
    name: rust accelerator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libasound2-dev

      - name: Build and install the extension
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" maturin
          maturin build --release --interpreter "$(which python)" \
            --manifest-path rust/upols_core/Cargo.toml --out dist
          pip install --no-deps dist/upols_core-*.whl

      - name: Run DSP tests with the Rust backend
        run: pytest -q tests/test_upols.py


  native:
    name: native macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test native DSP core
        run: cargo test --release --manifest-path rust/spatializer-core/Cargo.toml

      - name: Build Swift menu bar app
        run: ./macos/build.sh
