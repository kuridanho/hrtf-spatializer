[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hrtf-spatializer"
version = "0.1.0"
description = "Real-time HRTF binaural spatializer for macOS system audio"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Riku Honda", email = "kuridanho@gmail.com" }]
keywords = [
  "hrtf",
  "binaural",
  "spatial-audio",
  "audio-dsp",
  "macos",
  "blackhole",
  "sounddevice",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "numpy>=1.24",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
spatializer = "spatializer.__main__:main"

[project.urls]
Homepage = "https://github.com/kuridanho/hrtf-spatializer"
Repository = "https://github.com/kuridanho/hrtf-spatializer"
Issues = "https://github.com/kuridanho/hrtf-spatializer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/spatializer"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "scripts",
  "rust",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spatializer"]
