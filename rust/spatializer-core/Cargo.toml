[package]
name = "spatializer-core"
version = "0.1.0"
edition = "2021"
description = "Native real-time HRTF convolution core for the Spatializer app"
license = "MIT"

[lib]
name = "spatializer_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
rustfft = "6"
num-complex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
